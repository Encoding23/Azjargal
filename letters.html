<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Чамд зориулсан захидлууд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Marck+Script&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ЭНД ӨӨРЧЛӨХ ШААРДЛАГАГҮЙ — текстийг доорх CONFIG дотор засна
   ============================================================ */
:root{
  --night:#0d0b14;
  --wood1:#3a2418; --wood2:#2a1910; --wood3:#4a2e1e;
  --cream:#f3ead8; --cream2:#e8dcc3; --ink:#3b3340;
  --gold1:#f6d27a; --gold2:#d9a441; --red:#c8443c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overscroll-behavior:none;background:var(--night);overflow:hidden}
body{
  font-family:"Cormorant Garamond",Georgia,serif;color:var(--cream);
  display:flex;justify-content:center;align-items:center;
  background:
    radial-gradient(ellipse at 50% 120%,#2a2350 0%,transparent 60%),
    radial-gradient(ellipse at 80% -10%,#1d1838 0%,transparent 55%),
    var(--night);
}
#bgstars{position:fixed;inset:0;pointer-events:none}
#app{
  position:relative;width:100%;max-width:440px;height:100%;height:100dvh;max-height:940px;
  overflow:hidden;background:var(--wood2);
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}
@media (min-width:500px){#app{height:92vh;border-radius:22px}}
@media (max-width:499px){body{user-select:none;-webkit-user-select:none}}

/* ---------------- WINDOW ---------------- */
.window-zone{position:absolute;left:0;right:0;top:0;height:40%;z-index:1}
.sky{
  position:absolute;left:9%;right:9%;top:5%;bottom:12%;overflow:hidden;
  background:linear-gradient(#1b1d4f 0%,#3a3478 40%,#7a5fa6 68%,#e7978a 86%,#f2b38e 92%);
}
.stars span{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.moon{position:absolute;right:20%;top:12%;width:34px;height:34px;border-radius:50%;
  box-shadow:-8px 4px 0 0 #fbe7a6;transform:rotate(-15deg);filter:drop-shadow(0 0 10px rgba(251,231,166,.8))}
.moon-glow{position:absolute;right:13%;top:2%;width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,240,190,.35),transparent 70%)}
.sea{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(#2b2f63,#1a1c40)}
.sea i{position:absolute;right:22%;height:2px;background:rgba(251,231,166,.55);border-radius:2px;animation:shimmer 3s ease-in-out infinite}
@keyframes shimmer{50%{opacity:.3;transform:translateX(3px)}}
.island{position:absolute;left:-10%;bottom:22%;width:75%;height:22%;background:#1c1838;border-radius:50% 50% 0 0/100% 100% 0 0}
.house{position:absolute;left:30%;bottom:34%;width:22px}
.shoot{position:absolute;width:60px;height:2px;background:linear-gradient(90deg,#fff,transparent);opacity:0;transform:rotate(-20deg)}

.frame{position:absolute;left:9%;right:9%;top:5%;bottom:12%;border:7px solid #8a5a32;
  box-shadow:inset 0 0 0 2px #5d3a1f,0 0 0 2px #5d3a1f;perspective:900px;pointer-events:none}
.pane{position:absolute;top:0;bottom:0;width:50%;
  border:5px solid #8a5a32;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,0) 40%,rgba(255,255,255,.06) 60%,rgba(255,255,255,0));
  transition:transform 1.4s cubic-bezier(.6,.05,.25,1)}
.pane::after{content:"";position:absolute;left:0;right:0;top:48%;height:5px;background:#8a5a32}
.pane.l{left:0;transform-origin:left center}
.pane.r{right:0;transform-origin:right center}
.opened .pane.l{transform:rotateY(-108deg)}
.opened .pane.r{transform:rotateY(108deg)}
.sill{position:absolute;left:4%;right:4%;bottom:7%;height:7%;background:linear-gradient(#a06a3c,#6e4423);border-radius:3px;box-shadow:0 6px 10px rgba(0,0,0,.4)}
.plant{position:absolute;left:14%;bottom:13%;width:30px}
.curtain{position:absolute;top:0;width:15%;height:96%;
  background:repeating-linear-gradient(90deg,#b8322b 0 8px,#d4473d 8px 14px,#9c2822 14px 20px);
  box-shadow:0 0 18px rgba(0,0,0,.5);transition:transform 1.4s ease}
.curtain.l{left:0;border-radius:0 0 60% 0/0 0 18% 0;clip-path:polygon(0 0,100% 0,100% 55%,55% 62%,100% 100%,0 100%)}
.curtain.r{right:0;border-radius:0 0 0 60%/0 0 0 18%;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,45% 62%,0 55%)}
.tie{position:absolute;top:58%;width:16%;height:4px;background:var(--gold2);border-radius:2px;z-index:2}
.tie.l{left:0}.tie.r{right:0}
.rod{position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(#c79a4a,#7d5523);z-index:3}
.opened .curtain.l{transform:translateX(-25%)}
.opened .curtain.r{transform:translateX(25%)}

/* ---------------- DESK ---------------- */
.desk{position:absolute;left:0;right:0;top:40%;bottom:0;z-index:2;
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 1px,transparent 1px 7px,rgba(255,255,255,.025) 7px 9px,transparent 9px 23px),
    linear-gradient(var(--wood3),var(--wood1) 25%,var(--wood2));
  box-shadow:inset 0 10px 18px rgba(0,0,0,.45)}
.desk::before{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 12% 4%,rgba(255,190,100,.22),transparent 45%);pointer-events:none;transition:opacity .3s}
.candle{position:absolute;left:6%;top:-11%;width:44px;height:70px;z-index:4}
.candle .stick{position:absolute;left:15px;bottom:10px;width:14px;height:44px;border-radius:3px 3px 1px 1px;background:linear-gradient(90deg,#efe2c4,#fff8e6 40%,#d8c8a4)}
.candle .plate{position:absolute;left:0;bottom:2px;width:44px;height:11px;border-radius:50%;background:linear-gradient(#e7b74e,#a8741e)}
.candle .flame{position:absolute;left:17px;top:2px;width:10px;height:18px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(ellipse at 50% 70%,#fff 0 20%,#ffd36b 45%,#ff8a2a 80%);transform-origin:50% 100%;animation:flick .12s infinite alternate}
.candle .halo{position:absolute;left:-38px;top:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,110,.35),transparent 65%);animation:halo 2.5s ease-in-out infinite}
@keyframes flick{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.92,1.06) rotate(2deg)}}
@keyframes halo{50%{opacity:.7;transform:scale(1.08)}}
.ink{position:absolute;right:7%;top:-12%;width:56px;z-index:4}

.content{position:absolute;inset:0;padding:9% 7% 6%;display:flex;flex-direction:column;align-items:center;overflow-y:auto;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
h1{font-family:"Marck Script","Caveat",cursive;font-weight:400;font-size:clamp(40px,11vw,52px);color:#fbf1dc;letter-spacing:.5px;text-shadow:0 2px 12px rgba(255,200,120,.25);margin-top:4px}
.sub{font-style:italic;font-size:19px;color:#e9c99a;margin-top:2px}
.divider{margin:14px 0 22px;width:150px;height:12px;position:relative;transition:opacity .5s}
.divider::before,.divider::after{content:"";position:absolute;top:5px;width:62px;height:1px;background:linear-gradient(90deg,transparent,#c99a5c)}
.divider::before{left:0}.divider::after{right:0;transform:scaleX(-1)}
.divider b{position:absolute;left:69px;top:1px;color:var(--red);font-size:10px}
.btn-open{font-family:inherit;font-weight:600;letter-spacing:4px;font-size:14px;color:#4a2e10;
  padding:16px 34px;border:0;border-radius:8px;cursor:pointer;
  background:linear-gradient(#fbe08f,var(--gold1) 40%,var(--gold2));
  box-shadow:0 0 0 1px #b8862f inset,0 0 0 4px rgba(255,220,140,.15),0 8px 24px rgba(240,180,70,.35);
  animation:pulse 2.4s ease-in-out infinite;transition:opacity .5s,transform .5s}
.btn-open:active{transform:scale(.97)}
@keyframes pulse{50%{box-shadow:0 0 0 1px #b8862f inset,0 0 0 8px rgba(255,220,140,.08),0 8px 34px rgba(240,180,70,.55)}}
.hide{opacity:0!important;pointer-events:none!important}

.letters{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:18px 16px;margin-top:-8px}
.slot{aspect-ratio:1.5;position:relative}
.slot:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - 8px)}
.slot .envelope{opacity:0}
.slot.landed .envelope{opacity:1;animation:land .55s cubic-bezier(.3,1.5,.6,1)}
@keyframes land{from{transform:translateY(-30px) rotate(-8deg) scale(.6)}to{transform:none}}
.slot:nth-child(odd).landed .envelope{transform:rotate(-2deg)}
.slot:nth-child(even).landed .envelope{transform:rotate(2deg)}

/* ---------------- ENVELOPE ---------------- */
.envelope{position:absolute;inset:0;border-radius:4px;cursor:pointer;overflow:hidden;
  background:linear-gradient(160deg,#faf3e3,var(--cream2));
  box-shadow:0 6px 14px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.6) inset;transition:transform .25s}
.envelope:hover{transform:translateY(-3px) rotate(0)!important}
.envelope svg.lines{position:absolute;inset:0;width:100%;height:100%}
.envelope .seal{position:absolute;left:50%;top:0;transform:translate(-50%,-30%);width:22%;max-width:30px;aspect-ratio:1}
.envelope .stamp{position:absolute;right:7%;top:12%;width:15%;aspect-ratio:.82;padding:2px;background:#fff;
  -webkit-mask:radial-gradient(circle 1.6px at 2px 2px,transparent 98%,#000) -2px -2px/4px 4px;mask:radial-gradient(circle 1.6px at 2px 2px,transparent 98%,#000) -2px -2px/4px 4px}
.envelope .stamp i{display:block;width:100%;height:100%}
.envelope .post{position:absolute;right:20%;top:14%;width:30%}
.envelope .when{position:absolute;left:9%;bottom:12%;color:var(--ink);line-height:1.05}
.envelope .when small{display:block;font-family:"Caveat",cursive;font-size:12px;opacity:.55}
.envelope .when span{font-family:"Caveat",cursive;font-size:clamp(15px,4.4vw,19px);font-weight:600}
.envelope .kept{position:absolute;left:8%;top:10%;font-family:"Caveat",cursive;font-size:13px;color:var(--red);opacity:0;transform:rotate(-8deg);border:1.5px solid currentColor;border-radius:3px;padding:0 5px}
.envelope.is-read .kept{opacity:.85}
.slot .envelope .seal{top:-1px;transform:translate(-50%,-35%)}

/* ---------------- BIRD ---------------- */
#bird{position:absolute;left:0;top:0;width:58px;z-index:20;pointer-events:none;opacity:0}
#bird .wing{transform-origin:28px 22px;animation:flap .18s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.6)}}
#bird.facing-left svg{transform:scaleX(-1)}

/* ---------------- TOP CONTROLS ---------------- */
.ctrls{position:absolute;top:calc(14px + env(safe-area-inset-top));left:0;right:0;z-index:15;display:flex;justify-content:center;gap:8px;transition:opacity .4s}
.chip{font-family:inherit;font-size:11px;letter-spacing:2.5px;font-weight:600;color:#f5e7c8;
  background:rgba(20,16,30,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(255,230,180,.2);border-radius:20px;padding:7px 14px;cursor:pointer}
.chip.round{padding:7px 10px;letter-spacing:0}

/* ---------------- OVERLAY ---------------- */
#overlay{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(10,8,14,.9);opacity:0;pointer-events:none;transition:opacity .45s}
#overlay.show{opacity:1;pointer-events:auto}
.stage{position:relative;width:min(84%,330px);aspect-ratio:1.5;perspective:1000px;margin-top:-40px}
.big{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.5,0,.3,1),opacity .6s}
.big .back{position:absolute;inset:0;background:#e2d3b5;border-radius:5px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.big .paper{position:absolute;left:6%;right:6%;top:6%;height:88%;background:var(--cream);border-radius:2px;
  padding:7% 8%;color:var(--ink);font-family:"Caveat",cursive;font-size:16px;line-height:1.3;overflow:hidden;
  transition:transform .9s cubic-bezier(.5,0,.3,1)}
.big .front{position:absolute;inset:0;border-radius:5px;overflow:hidden;
  background:linear-gradient(160deg,#faf3e3,var(--cream2));
  clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.big .front svg.lines{position:absolute;inset:0;width:100%;height:100%}
.big .flap{position:absolute;left:0;right:0;top:0;height:58%;transform-origin:50% 0;transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.5,0,.3,1);z-index:5}
.big .flap .face{position:absolute;inset:0;backface-visibility:hidden;clip-path:polygon(0 0,100% 0,50% 100%);
  background:linear-gradient(#f6eedb,#ece0c6)}
.big .flap .inner{transform:rotateX(180deg);background:linear-gradient(#d9c7a3,#cdb995)}
.big .seal{position:absolute;left:50%;top:56%;width:52px;height:52px;transform:translate(-50%,-50%);z-index:6;transition:transform .5s,opacity .5s}
.big .when{position:absolute;left:8%;bottom:10%;color:var(--ink);z-index:4}
.big .when small{display:block;font-family:"Caveat",cursive;font-size:14px;opacity:.55}
.big .when span{font-family:"Caveat",cursive;font-size:24px;font-weight:600}
.big .stamp{position:absolute;right:6%;top:46%;width:13%;aspect-ratio:.82;padding:3px;background:#fff;z-index:4;
  -webkit-mask:radial-gradient(circle 2px at 2.5px 2.5px,transparent 98%,#000) -2.5px -2.5px/5px 5px;mask:radial-gradient(circle 2px at 2.5px 2.5px,transparent 98%,#000) -2.5px -2.5px/5px 5px}
.big .stamp i{display:block;width:100%;height:100%}
.big .post{position:absolute;right:20%;top:50%;width:28%;z-index:4}
.big.flap-open .flap{transform:rotateX(180deg);z-index:1}
.big.flap-open .seal{opacity:0;transform:translate(-50%,-50%) scale(1.4) rotate(20deg)}
.big.paper-out .paper{transform:translateY(-62%)}

.letter{position:absolute;left:50%;top:50%;width:min(80%,320px);max-height:76%;overflow-y:auto;
  transform:translate(-50%,-50%);background:var(--cream);color:var(--ink);border-radius:3px;
  padding:26px 26px 22px;font-family:"Caveat",cursive;font-size:21px;line-height:1.45;
  background-image:linear-gradient(rgba(120,90,60,.06) 1px,transparent 1px);background-size:100% 30px;
  box-shadow:0 25px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transform-origin:50% 0;scrollbar-width:thin}
.letter.show{opacity:1;pointer-events:auto}
.letter .lw{font-size:15px;opacity:.55;margin-bottom:8px}
.letter .dear{font-size:24px;margin-bottom:6px}
.letter .body p{margin-bottom:10px}
.letter .sign{text-align:right;margin-top:10px;font-size:22px}
.letter::after{content:"";position:absolute;left:0;right:0;top:33.3%;height:1px;background:rgba(0,0,0,.07);box-shadow:0 calc(var(--h,100px)/3) 0 rgba(0,0,0,.07)}

.ask{margin-top:36px;text-align:center;transition:opacity .4s}
.ask h2{font-style:italic;font-weight:500;font-size:30px;color:#f1e3c6}
.btn-red{margin-top:18px;font-family:inherit;font-size:17px;font-weight:600;color:#fff4ec;border:0;border-radius:24px;
  padding:11px 52px;background:linear-gradient(#d65a4f,#b33a33);box-shadow:0 8px 24px rgba(200,68,60,.4);cursor:pointer}
.link{display:block;margin:14px auto 0;background:none;border:0;color:#d9b277;font-family:inherit;font-weight:600;letter-spacing:3px;font-size:12px;cursor:pointer}
.after{position:absolute;bottom:7%;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:22px;opacity:0;pointer-events:none;transition:opacity .5s}
.after.show{opacity:1;pointer-events:auto}
.after .link{margin:0;font-size:13px}
.after i{width:1px;height:14px;background:rgba(217,178,119,.5)}

.hearts{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.hearts span{position:absolute;bottom:-20px;color:#e0605a;animation:rise 2.6s ease-out forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<canvas id="bgstars"></canvas>

<div id="app">
  <!-- WINDOW -->
  <div class="window-zone" id="win">
    <div class="sky">
      <div class="stars" id="stars"></div>
      <div class="moon-glow"></div><div class="moon"></div>
      <div class="shoot" id="shoot"></div>
      <div class="island"></div>
      <svg class="house" viewBox="0 0 22 20"><path d="M2 9 11 2l9 7v11H2z" fill="#2a2450"/><path d="M0 10 11 1l11 9" stroke="#3a3268" stroke-width="2" fill="none"/><rect x="8" y="11" width="6" height="5" fill="#ffd982"/></svg>
      <div class="sea"><i style="bottom:70%;width:28px"></i><i style="bottom:50%;width:20px;animation-delay:.6s"></i><i style="bottom:30%;width:14px;animation-delay:1.2s"></i><i style="bottom:12%;width:9px;animation-delay:1.8s"></i></div>
    </div>
    <div class="frame"><div class="pane l"></div><div class="pane r"></div></div>
    <div class="sill"></div>
    <svg class="plant" viewBox="0 0 30 34"><path d="M15 20C13 12 6 9 3 10c4 1 8 5 10 11M15 20c1-9 6-14 11-14-4 3-7 8-9 15M15 21c0-8-2-15-1-19 2 5 3 12 2 19" fill="#6fae5b" stroke="#4f8a43" stroke-width=".6"/><path d="M7 20h16l-2 13H9z" fill="#c8693a"/><rect x="6" y="19" width="18" height="3" rx="1" fill="#de7c48"/></svg>
    <div class="curtain l"></div><div class="curtain r"></div>
    <div class="tie l"></div><div class="tie r"></div>
    <div class="rod"></div>
  </div>

  <!-- DESK -->
  <div class="desk">
    <div class="candle"><div class="halo"></div><div class="flame"></div><div class="stick"></div><div class="plate"></div></div>
    <svg class="ink" viewBox="0 0 56 80">
      <path d="M50 2C40 8 30 24 26 50l2 1C34 30 44 14 54 4z" fill="#f7f1e6"/><path d="M52 3 27 51" stroke="#cbbfa8" stroke-width=".8"/>
      <path d="M44 6c-3 1-6 4-8 7M48 10c-3 2-6 5-8 9M40 14c-2 2-4 5-5 8" stroke="#ddd3bf" stroke-width=".7" fill="none"/>
      <rect x="14" y="44" width="22" height="7" rx="2" fill="#1c2a5c"/>
      <path d="M8 60c0-6 6-9 17-9s17 3 17 9v12c0 4-7 6-17 6S8 76 8 72z" fill="#223a7a"/>
      <path d="M13 58c3-2 7-3 12-3" stroke="#6f8fd6" stroke-width="2" stroke-linecap="round" fill="none" opacity=".7"/>
    </svg>
    <div class="content">
      <h1 id="toName"></h1>
      <div class="sub" id="subLine"></div>
      <div class="divider" id="divider"><b>♥</b></div>
      <button class="btn-open" id="openBtn"></button>
      <div class="letters" id="letters"></div>
    </div>
  </div>

  <div class="ctrls hide" id="ctrls">
    <button class="chip" id="skipBtn"></button>
    <button class="chip round" id="replayBtn" title="Дахин">↺</button>
    <button class="chip round" id="soundBtn" title="Дуу">🔊</button>
  </div>

  <div id="bird">
    <svg viewBox="0 0 60 44">
      <path d="M8 24c-6 0-8-3-8-3 4 0 7-1 10-3z" fill="#2c5fb0"/>
      <ellipse cx="27" cy="25" rx="17" ry="11" fill="#3d7fd9"/>
      <path d="M14 28c6 7 20 7 27 0-5 3-21 3-27 0z" fill="#f4efe6"/>
      <circle cx="42" cy="19" r="9" fill="#3d7fd9"/>
      <path d="M38 23c3 2 6 2 8 0-2 4-6 4-8 0z" fill="#f4efe6"/>
      <circle cx="45" cy="17" r="1.8" fill="#14162b"/><circle cx="45.6" cy="16.4" r=".6" fill="#fff"/>
      <path d="M50 19l8 2-8 2z" fill="#f2a33a"/>
      <g class="wing"><path d="M18 20c4-12 14-16 20-12-3 1-6 6-8 12z" fill="#2c66c4"/><path d="M22 18c3-6 7-8 10-8" stroke="#5d97e8" stroke-width="1.2" fill="none"/></g>
      <g transform="translate(46 26) rotate(10)"><rect width="13" height="9" rx="1" fill="#f6efdf" stroke="#d4c6a8" stroke-width=".6"/><path d="M0 0l6.5 5L13 0" stroke="#d4c6a8" stroke-width=".6" fill="none"/><circle cx="6.5" cy="5" r="1.7" fill="#c8443c"/></g>
    </svg>
  </div>

  <!-- OVERLAY -->
  <div id="overlay">
    <div class="stage">
      <div class="big" id="big">
        <div class="back"></div>
        <div class="paper" id="paperPeek"></div>
        <div class="front">
          <svg class="lines" viewBox="0 0 300 200" preserveAspectRatio="none"><path d="M0 200 150 112 300 200" stroke="#cdbd9c" stroke-width="1.2" fill="none"/></svg>
        </div>
        <div class="flap"><div class="face"></div><div class="face inner"></div></div>
        <svg class="seal" viewBox="0 0 60 60" id="bigSeal"></svg>
        <svg class="post" viewBox="0 0 90 40"></svg>
        <div class="stamp"><i></i></div>
        <div class="when"><small></small><span></span></div>
      </div>
    </div>
    <div class="letter" id="letter"></div>
    <div class="ask" id="ask">
      <h2 id="askTitle"></h2>
      <button class="btn-red" id="yesBtn"></button>
      <button class="link" id="noBtn"></button>
    </div>
    <div class="after" id="after">
      <button class="link" id="foldBtn"></button><i></i><button class="link" id="keepBtn"></button>
    </div>
  </div>
  <div class="hearts" id="hearts"></div>
</div>

<script>
/* ==================================================================
   ✏️  ЗӨВХӨН ЭНИЙГ ЗАСНА: нэр, захидлууд, товчны бичвэр
   ================================================================== */
const CONFIG = {
  to:   "Азаа минь,",                          // Том гарчиг
  from: "Чиний Тэмүүлэн",                      // Гарын үсэг
  subtitle: (n) => `Тэмүүлэнгээс ${n} захидал`, // Гарчгийн доорх мөр

  // 🎵 Хөгжим: дуртай дууныхаа mp3-ыг энэ файлтай ижил хавтсанд "song.mp3" нэрээр хийнэ.
  // Хоосон ("") үлдээвэл намуухан хөгжмийн хайрцагны аялгуу өөрөө тоглоно.
  music: "udur-shunu.mp3",

  labels: {
    openWindow: "ЦОНХОО НЭЭ",
    bringAll:   "БҮГДИЙГ НЬ АВЧИР ⏩",
    openWhen:   "Нээгээрэй:",
    isItTime:   "Нээх цаг нь болсон уу?",
    openIt:     "Нээх",
    notYet:     "ОДООХОНДОО ҮГҮЙ",
    foldIt:     "ЭВХЭХ",
    keepIt:     "ХАДГАЛАХ",
    kept:       "уншсан ♥",
  },
  letters: [
    {
      when: "намайг санасан үедээ",
      dear: "Жулжага минь,",
      stamp: "sunset",
      body: [
        "Яг одоо чиний дэргэд байдаг ч болоосой. Чамайг тэврээд, духан дээр чинь үнсээд, чамд ямар их хайртайгаа дахин дахин хэлмээр байна.",
        "Тэр болтол нэг зүйлийг битгий мартаарай: хаа нэгтээ нэг хүн чамайг үхтлээ санаж байгаа шүү. ❤️"
      ]
    },
    {
      when: "их ядарсан үедээ",
      dear: "Гүнж минь,",
      stamp: "sea",
      body: [
        "Өнөөдөр их ядарсан уу? Чи ямар их хичээж байгааг чинь би мэднэ. Ийм хичээнгүй, хөөрхөн охин миний хайртай хүн гэдгээр би үргэлж бахархдаг.",
        "Одоо бүх зүйлээ түр мартаад, халуун цай уугаад сайхан амраарай. Маргааш шинэ өдөр эхэлнэ. Би үргэлж чиний талд байна. 🌙"
      ]
    },
    {
      when: "нойр хүрэхгүй үедээ",
      dear: "Хайр минь,",
      stamp: "meadow",
      body: [
        "Чамайг тэврээд унтуулж чаддаг ч болоосой. Нүдээ аниад, би яг хажууд чинь байна гэж бодоорой.",
        "Нэг, хоёр, гурав... Сайхан зүүд зүүдлээрэй, хайраа. Маргааш өглөө чамайг хамгийн түрүүнд санах хүн нь би байх болно. ✨"
      ]
    }
  ]
};
/* ================================================================== */

const $ = s => document.querySelector(s);
const app = $('#app');
const L = CONFIG.labels;
const STORE = 'openwhen-read-v1';
let readSet; try{ readSet=new Set(JSON.parse(localStorage.getItem(STORE)||'[]')); }catch(e){ readSet=new Set(); }

/* ---------- texts ---------- */
$('#toName').textContent = CONFIG.to;
$('#subLine').textContent = CONFIG.subtitle(CONFIG.letters.length);
$('#openBtn').textContent = L.openWindow;
$('#skipBtn').textContent = L.bringAll;
$('#askTitle').textContent = L.isItTime;
$('#yesBtn').textContent = L.openIt;
$('#noBtn').textContent = L.notYet;
$('#foldBtn').textContent = L.foldIt;
$('#keepBtn').textContent = L.keepIt;

/* ---------- art helpers ---------- */
const STAMPS = {
  sunset: 'linear-gradient(#f4c98a 0 45%,#e8875a 45% 60%,#c76b45 60%)',
  sea:    'linear-gradient(#a9c8ee 0 50%,#5d8cc9 50% 70%,#3f6aa6 70%)',
  meadow: 'linear-gradient(#cfe6b0 0 50%,#8cbf6a 50% 72%,#5f9a48 72%)',
  rose:   'linear-gradient(#f6d0d4 0 50%,#e58b98 50% 72%,#c4566a 72%)',
};
const sealSVG = `<defs><radialGradient id="sg" cx="40%" cy="35%"><stop offset="0" stop-color="#e6655c"/><stop offset="1" stop-color="#a92e28"/></radialGradient></defs>
  <path d="M30 3c6 0 8 3 13 4s9 5 10 10 4 8 3 13-3 9-6 12-6 7-11 8-8 3-12 2-9-2-13-5-7-6-8-11-3-9-1-14 4-8 8-11 9-4 13-4z" fill="url(#sg)"/>
  <circle cx="30" cy="30" r="17" fill="none" stroke="#8f2520" stroke-width="1.5" opacity=".6"/>
  <path d="M30 40s-10-6-10-12a5 5 0 0 1 10-2 5 5 0 0 1 10 2c0 6-10 12-10 12z" fill="#f3b0a6" opacity=".85"/>`;
const postSVG = `<circle cx="18" cy="20" r="15" fill="none" stroke="#7a7066" stroke-width="1.4" opacity=".55"/>
  <circle cx="18" cy="20" r="10" fill="none" stroke="#7a7066" stroke-width=".8" opacity=".45"/>
  <path d="M18 20h0" stroke="#7a7066"/>
  ${[0,1,2].map(i=>`<path d="M36 ${12+i*7}c6-4 10 4 16 0s10 4 16 0 10 4 16 0" fill="none" stroke="#7a7066" stroke-width="1.2" opacity=".5"/>`).join('')}`;
$('#bigSeal').innerHTML = sealSVG;
$('.big .post').innerHTML = postSVG;

function envelopeHTML(l, i){
  return `<div class="envelope ${readSet.has(i)?'is-read':''}" data-i="${i}">
    <svg class="lines" viewBox="0 0 150 100" preserveAspectRatio="none">
      <path d="M0 0 75 56 150 0M0 100 62 48M150 100 88 48" stroke="#d3c4a5" stroke-width=".8" fill="none"/></svg>
    <svg class="seal" viewBox="0 0 60 60">${sealSVG.replace('id="sg"','id="sg'+i+'"').replace('url(#sg)','url(#sg'+i+')')}</svg>
    <svg class="post" viewBox="0 0 90 40">${postSVG}</svg>
    <div class="stamp"><i style="background:${STAMPS[l.stamp]||STAMPS.rose}"></i></div>
    <div class="when"><small>${L.openWhen}</small><span>${l.when}</span></div>
    <div class="kept">${L.kept}</div>
  </div>`;
}

/* ---------- stars ---------- */
const st = $('#stars');
for(let i=0;i<38;i++){
  const s=document.createElement('span');
  s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*62+'%';
  s.style.animationDelay=(Math.random()*3)+'s';
  if(Math.random()<.2){s.style.width=s.style.height='3px'}
  st.appendChild(s);
}
(function bg(){
  const c=$('#bgstars'),x=c.getContext('2d');
  const draw=()=>{c.width=innerWidth;c.height=innerHeight;x.clearRect(0,0,c.width,c.height);
    for(let i=0;i<160;i++){x.globalAlpha=Math.random()*.7+.1;x.fillStyle='#fff';x.fillRect(Math.random()*c.width,Math.random()*c.height,Math.random()*1.6+.3,Math.random()*1.6+.3)}};
  draw(); addEventListener('resize',draw);
})();
setInterval(()=>{
  const s=$('#shoot');
  s.animate([{opacity:0,left:'10%',top:'8%'},{opacity:1,offset:.2},{opacity:0,left:'55%',top:'25%'}],{duration:1100,easing:'ease-out'});
},7000);


/* ---------- music ---------- */
const music = (() => {
  let audio=null, ctx=null, master=null, timer=null, on=true, started=false;
  const f = m => 440*Math.pow(2,(m-69)/12);
  const BARS=[[60,67,72,76,72,67],[57,64,69,72,69,64],[53,60,65,69,65,60],[55,62,67,71,67,62]];
  const MEL=[[76,79],[76,72],[72,74],[71,67]];
  function note(m,t,vol,len){
    const o=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o2.type='triangle'; o.frequency.value=f(m); o2.frequency.value=f(m)*2;
    const g2=ctx.createGain(); g2.gain.value=.12;
    o.connect(g); o2.connect(g2).connect(g); g.connect(master);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+len);
    o.start(t); o2.start(t); o.stop(t+len+.05); o2.stop(t+len+.05);
  }
  function synth(){
    if(master) return;
    ctx.resume();
    master=ctx.createGain(); master.gain.value=.16;
    const d=ctx.createDelay(); d.delayTime.value=.33; const fb=ctx.createGain(); fb.gain.value=.3;
    const wet=ctx.createGain(); wet.gain.value=.35;
    master.connect(ctx.destination); master.connect(d); d.connect(fb).connect(d); d.connect(wet).connect(ctx.destination);
    const beat=60/66/2; let bar=0, next=ctx.currentTime+.1;
    const sched=()=>{ while(next<ctx.currentTime+1.2){
      const b=bar%4; BARS[b].forEach((m,i)=>note(m,next+i*beat,.22,1.8));
      MEL[b].forEach((m,i)=>note(m+12,next+i*beat*3,.12,2.4));
      next+=beat*6; bar++; } };
    sched(); timer=setInterval(sched,300);
  }
  return {
    start(){ // must run inside a tap/click
      if(started) return; started=true;
      ctx=new (window.AudioContext||window.webkitAudioContext)(); ctx.resume();
      if(CONFIG.music){
        audio=new Audio(CONFIG.music); audio.loop=true; audio.volume=.6;
        audio.play().catch(()=>{ audio=null; synth(); });
        audio.addEventListener('error',()=>{ if(audio){audio=null; synth();} });
      } else synth();
    },
    toggle(){
      on=!on;
      if(audio){ on?audio.play():audio.pause(); }
      if(ctx){ on?ctx.resume():ctx.suspend(); }
      return on;
    }
  };
})();
$('#soundBtn').onclick = () => { if(!music.toggle) return; $('#soundBtn').textContent = music.toggle() ? '🔊' : '🔇'; };

/* ---------- delivery ---------- */
const lettersEl = $('#letters');
let skipping=false, delivering=false, flight=null;
const wait = ms => new Promise(r=>setTimeout(r,ms));
const play = (el,kf,o) => { const a=el.animate(kf,o); return Promise.race([a.finished.catch(()=>{}), wait(o.duration+150)]); };

function rectIn(el){const a=app.getBoundingClientRect(),r=el.getBoundingClientRect();return{x:r.left-a.left,y:r.top-a.top,w:r.width,h:r.height}}

async function flyTo(bird, from, to, dur){
  bird.classList.toggle('facing-left', to.x < from.x);
  const mid={x:(from.x+to.x)/2+(Math.random()*60-30), y:Math.min(from.y,to.y)-40};
  if(skipping) return;
  flight = bird.animate([
    {transform:`translate(${from.x}px,${from.y}px) scale(${from.s})`},
    {transform:`translate(${mid.x}px,${mid.y}px) scale(${(from.s+to.s)/2})`},
    {transform:`translate(${to.x}px,${to.y}px) scale(${to.s})`}
  ],{duration:dur,easing:'ease-in-out',fill:'forwards'});
  await Promise.race([flight.finished.catch(()=>{}), wait(dur+150)]);
}

async function deliver(){
  if(delivering) return; delivering=true;
  music.start();
  $('#win').classList.add('opened');
  $('#openBtn').classList.add('hide'); $('#divider').classList.add('hide');
  await wait(600);
  $('#openBtn').style.display='none';
  $('#ctrls').classList.remove('hide');

  lettersEl.innerHTML='';
  CONFIG.letters.forEach((l,i)=>{const d=document.createElement('div');d.className='slot';d.innerHTML=envelopeHTML(l,i);lettersEl.appendChild(d)});
  const slots=[...lettersEl.children];
  const bird=$('#bird'); const sky=rectIn($('.sky'));
  const home={x:sky.x+sky.w/2-29,y:sky.y+sky.h*.35,s:.35};

  for(const slot of slots){
    if(skipping) break;
    const t=rectIn(slot);
    const target={x:t.x+t.w/2-29,y:t.y-18,s:1};
    bird.style.opacity=1;
    await flyTo(bird,home,target,1500);
    if(skipping) break;
    bird.querySelector('g[transform]').style.opacity=0;
    slot.classList.add('landed');
    await wait(250);
    await flyTo(bird,target,{x:app.clientWidth+40,y:home.y-20,s:.6},1000);
    bird.querySelector('g[transform]').style.opacity=1;
    bird.style.opacity=0;
    await wait(200);
  }
  if(skipping){ bird.style.opacity=0; slots.forEach((s,i)=>setTimeout(()=>s.classList.add('landed'),i*120)); }
  $('#skipBtn').classList.add('hide');
  delivering=false;
}

$('#openBtn').onclick = deliver;
$('#skipBtn').onclick = () => { skipping=true; if(flight) flight.cancel(); };
$('#replayBtn').onclick = () => {
  if(delivering) return;
  skipping=false;
  $('#skipBtn').classList.remove('hide');
  $('#win').classList.remove('opened');
  lettersEl.innerHTML='';
  setTimeout(deliver,900);
};

/* ---------- open letter ---------- */
let current=-1;
const big=$('#big'), ov=$('#overlay'), letter=$('#letter'), ask=$('#ask'), after=$('#after');

lettersEl.addEventListener('click',e=>{
  const env=e.target.closest('.envelope'); if(!env||delivering) return;
  current=+env.dataset.i; const l=CONFIG.letters[current];
  big.className='big';
  big.style.transform=''; big.style.opacity=1;
  big.querySelector('.when small').textContent=L.openWhen;
  big.querySelector('.when span').textContent=l.when;
  big.querySelector('.stamp i').style.background=STAMPS[l.stamp]||STAMPS.rose;
  $('#paperPeek').innerHTML=`<div style="opacity:.5;font-size:13px">${L.openWhen} ${l.when}</div><div style="font-size:18px">${l.dear||CONFIG.to}</div><div>${l.body[0]}</div>`;
  letter.innerHTML=`<div class="lw">${L.openWhen} ${l.when}</div><div class="dear">${l.dear||CONFIG.to}</div>
    <div class="body">${l.body.map(p=>`<p>${p}</p>`).join('')}</div><div class="sign">${CONFIG.from}</div>`;
  letter.classList.remove('show'); after.classList.remove('show'); ask.classList.remove('hide');
  ov.classList.add('show');
  big.animate([{transform:'translateY(40px) scale(.8)',opacity:0},{transform:'none',opacity:1}],{duration:500,easing:'cubic-bezier(.3,1.3,.6,1)'});
});

$('#noBtn').onclick=()=>{
  big.animate([{transform:'none'},{transform:'translateY(30px) scale(.85)',opacity:0}],{duration:350,easing:'ease-in'});
  setTimeout(()=>ov.classList.remove('show'),200);
};

$('#yesBtn').onclick=async()=>{
  ask.classList.add('hide');
  big.classList.add('flap-open');
  await wait(750);
  big.classList.add('paper-out');
  await wait(950);
  big.style.transition='transform .7s ease, opacity .5s';
  big.style.transform='translateY(55%)'; big.style.opacity=0;
  letter.classList.add('show');
  await play(letter,[
    {transform:'translate(-50%,-80%) scale(.7) rotateX(70deg)',opacity:0},
    {transform:'translate(-50%,-50%) scale(1) rotateX(0)',opacity:1}
  ],{duration:700,easing:'cubic-bezier(.3,1.2,.5,1)'});
  letter.style.setProperty('--h',letter.offsetHeight+'px');
  after.classList.add('show');
  hearts(10);
};

async function closeLetter(fold){
  after.classList.remove('show');
  if(fold){
    await play(letter,[
      {transform:'translate(-50%,-50%) scaleY(1)'},
      {transform:'translate(-50%,-50%) scaleY(.34)',offset:.5},
      {transform:'translate(-50%,0%) scaleY(.2) scaleX(.6)',opacity:0}
    ],{duration:800,easing:'ease-in-out'});
  }else{
    const env=lettersEl.querySelector(`.envelope[data-i="${current}"]`);
    const r=rectIn(env), a={x:app.clientWidth/2,y:app.clientHeight/2};
    await play(letter,[
      {transform:'translate(-50%,-50%) scale(1)',opacity:1},
      {transform:`translate(calc(-50% + ${r.x+r.w/2-a.x}px),calc(-50% + ${r.y+r.h/2-a.y}px)) scale(.15)`,opacity:.2}
    ],{duration:750,easing:'cubic-bezier(.5,0,.3,1)'});
    readSet.add(current); try{ localStorage.setItem(STORE,JSON.stringify([...readSet])); }catch(e){}
    env.classList.add('is-read');
  }
  letter.classList.remove('show');
  ov.classList.remove('show');
  big.style.transition=''; big.style.transform=''; big.style.opacity=1;
}
$('#foldBtn').onclick=()=>closeLetter(true);
$('#keepBtn').onclick=()=>closeLetter(false);

function hearts(n){
  const h=$('#hearts');
  for(let i=0;i<n;i++){const s=document.createElement('span');s.textContent='♥';
    s.style.left=(10+Math.random()*80)+'%';s.style.fontSize=(10+Math.random()*16)+'px';s.style.animationDelay=(Math.random()*.6)+'s';
    h.appendChild(s);setTimeout(()=>s.remove(),3400)}
}
</script>
</body>
</html>
