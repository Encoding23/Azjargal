<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Азжаргал ❤️</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fff0f3;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            color: #ff4d6d;
            margin-bottom: 20px;
        }

        /* Зургийн цэс болон томрох эффект */
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }

        .photo-card img {
            width: 100%;
            max-width: 300px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .photo-card img:hover, .photo-card img:active {
            transform: scale(1.15);
            box-shadow: 0 15px 30px rgba(214, 51, 132, 0.4);
            z-index: 10;
            position: relative;
        }

        /* "Хэрэв намайг санавал" товчны загвар */
        .special-btn {
            background: linear-gradient(135deg, #ff4d6d, #ff758c);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            transition: transform 0.2s ease;
            margin: 20px 0;
        }

        .special-btn:active {
            transform: scale(0.95);
        }

        /* Popup цонхны загвар */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .popup-content {
            background: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            animation: popIn 0.3s ease;
        }

        .popup-content img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .popup-content p {
            font-size: 16px;
            color: #333;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .popup-content .love-text {
            color: #ff4d6d;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .close-btn {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>Азжаргал хонгор минь ❤️</h1>

    <!-- Дуу тоглуулагч -->
    <audio controls autoplay loop style="margin-bottom: 20px;">
        <source src="song.mp3" type="audio/mp3">
        Таны браузер дуу дэмжихгүй байна.
    </audio>

    <!-- Зургийн цомгууд (Та өөрийнхөөрөө нэмж хасаж болно) -->
    <div class="gallery">
        <div class="photo-card"><img src="photo1.jpg" alt="Memory 1"></div>
        <div class="photo-card"><img src="photo2.jpg" alt="Memory 2"></div>
        <div class="photo-card"><img src="photo3.jpg" alt="Memory 3"></div>
    </div>

    <!-- "Хэрэв намайг санавал" товч -->
    <div>
        <button class="special-btn" onclick="openSpecialPhoto()">✨ Хэрэв намайг санавал...</button>
    </div>

    <!-- Дархад гарч ирэх тусгай цонх -->
    <div id="specialPopup" class="popup-overlay">
        <div class="popup-content">
            <!-- Энд гарч ирэх тусгай зургийн нэр (жишээ нь photo4.jpg) -->
            <img src="photo4.jpg" alt="Special Memory">
            <p>Би чамтай дандаа хамт байгаа шүү!</p>
            <div class="love-text">Хайртай шүү!</div>
            <button class="close-btn" onclick="closeSpecialPhoto()">Хаах</button>
        </div>
    </div>

    <!-- JavaScript код -->
    <script>
        function openSpecialPhoto() {
            document.getElementById('specialPopup').style.display = 'flex';
        }
        function closeSpecialPhoto() {
            document.getElementById('specialPopup').style.display = 'none';
        }
    </script>

</body>
</html>
